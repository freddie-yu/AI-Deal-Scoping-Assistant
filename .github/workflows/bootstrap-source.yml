name: Bootstrap project source

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/ai-deal-source.zip
          unzip -oq /tmp/ai-deal-source.zip -d .

      - name: Commit imported source
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import local project source"
          git push origin HEAD:master
