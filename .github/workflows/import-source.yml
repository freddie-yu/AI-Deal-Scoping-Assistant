name: Import source archive

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch source archive blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BLOB_SHA: e86bffa45555e6b1a1487ab678ba6874f6814071
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ["REPO"]
          sha = os.environ["BLOB_SHA"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          content = payload["content"].replace("\n", "")
          with open("/tmp/source.zip", "wb") as fh:
              fh.write(base64.b64decode(content))
          PY

      - name: Replace bootstrap files with project source
        run: |
          rm -f _init.txt
          unzip -qo /tmp/source.zip -d .
          rm -f .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI Deal Scoping Assistant source"
          git push origin HEAD:master
